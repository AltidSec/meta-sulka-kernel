# Disable loadable kernel module support entirely. With modules disabled,
# the kernel cannot load arbitrary code at runtime, which removes a
# significant class of post-boot attack surface.
# CONFIG_MODULES is not set

# The following options depend on CONFIG_MODULES and become inactive when
# it is disabled. They are listed explicitly to document the intent and to
# catch any configuration that would attempt to re-enable them.
# CONFIG_MODULE_FORCE_LOAD is not set
# CONFIG_MODULE_UNLOAD is not set
# CONFIG_MODULE_FORCE_UNLOAD is not set
# CONFIG_MODVERSIONS is not set
# CONFIG_MODULE_SRCVERSION_ALL is not set
# CONFIG_MODULE_SIG is not set
# CONFIG_MODULE_SIG_ALL is not set
# CONFIG_MODULE_SIG_FORCE is not set
# CONFIG_MODULE_COMPRESS_NONE is not set
# CONFIG_MODULE_COMPRESS_GZIP is not set
# CONFIG_MODULE_COMPRESS_XZ is not set
# CONFIG_MODULE_COMPRESS_ZSTD is not set
# CONFIG_MODULE_ALLOW_BTF_MISMATCH is not set
# CONFIG_TRIM_UNUSED_KSYMS is not set
